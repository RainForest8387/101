---
# Параметры вынесены в group_vars/kafka_ui/:
#   main.yml  — открытые настройки
#   vault.yml — пароли (ansible-vault), см. vault.yml.example
#
#   ansible-playbook -i inventory.ini playbook.yml --ask-vault-pass
#
- name: Deploy Kafka UI
  hosts: kafka_ui
  become: true
  gather_facts: true

  pre_tasks:
    - name: Assert that vault variables are available
      ansible.builtin.assert:
        that:
          - vault_kafka_sasl_password is defined
          - vault_kafka_truststore_password is defined
        fail_msg: >-
          Не найдены переменные из vault. Запустите плейбук с
          --ask-vault-pass или --vault-password-file и убедитесь, что
          group_vars/kafka_ui/vault.yml существует и расшифровывается.
        quiet: true
      tags: ['always']

  roles:
    - role: kfk-ui-role
