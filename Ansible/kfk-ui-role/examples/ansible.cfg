[defaults]
# Роль лежит на уровень выше каталога examples/ — ищем её в каталоге Ansible/
roles_path = ../..
inventory = inventory.ini
host_key_checking = True
# читаемый вывод задач (ansible-core >= 2.13)
result_format = yaml

# Файл с паролем от ansible-vault (chmod 600, в git не коммитить).
# Если не задан — запускайте плейбук с --ask-vault-pass.
# vault_password_file = ~/.vault_pass_kafka_ui

# Несколько окружений: --vault-id prod@~/.vault_pass_prod
# vault_identity_list = prod@~/.vault_pass_prod, stage@~/.vault_pass_stage
