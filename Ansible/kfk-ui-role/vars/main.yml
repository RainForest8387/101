---
# Внутренние переменные роли. Не переопределяйте их в inventory —
# для расширения конфигурации используйте kafka_ui_config_extra.

_kafka_ui_cfg_server: >-
  {{
    {
      'server': {
        'port': kafka_ui_server_port | int,
        'address': kafka_ui_server_address
      } | combine(
        {'servlet': {'context-path': kafka_ui_context_path}}
        if (kafka_ui_context_path | default('') | length) > 0 else {}
      )
    }
  }}

_kafka_ui_cfg_kafka: >-
  {{ {'kafka': {'clusters': _kafka_ui_clusters_effective}} }}

_kafka_ui_cfg_auth: >-
  {{
    {'auth': {'type': kafka_ui_auth_type}} | combine(
      {
        'spring': {
          'security': {
            'user': {
              'name': kafka_ui_admin_user,
              'password': kafka_ui_admin_password
            }
          }
        }
      }
      if kafka_ui_auth_type == 'LOGIN_FORM' else {},
      recursive=True
    )
  }}

_kafka_ui_cfg_dynamic: >-
  {{ {'dynamic': {'config': {'enabled': kafka_ui_dynamic_config_enabled | bool}}} }}

_kafka_ui_cfg_logging: >-
  {{
    {
      'logging': {
        'level': {'root': kafka_ui_log_level_root} | combine(kafka_ui_log_levels | default({}, true))
      },
      'management': {
        'endpoints': {'web': {'exposure': {'include': 'info,health'}}},
        'endpoint': {'health': {'show-details': 'never'}}
      }
    }
  }}

# ------------------------------------------------------------------------------
# Параметры безопасности подключения к Kafka (SASL_SSL / SCRAM-SHA-256)
# ------------------------------------------------------------------------------
# Путь к truststore на целевом хосте: либо скопированный из files/, либо
# заранее размещённый администратором.
_kafka_ui_truststore_dest: >-
  {{ (kafka_ui_ssl_dir ~ '/' ~ (kafka_ui_ssl_truststore_src | basename))
     if (kafka_ui_ssl_truststore_src | default('') | length) > 0
     else (kafka_ui_ssl_truststore_path | default('')) }}

_kafka_ui_keystore_dest: >-
  {{ (kafka_ui_ssl_dir ~ '/' ~ (kafka_ui_ssl_keystore_src | basename))
     if (kafka_ui_ssl_keystore_src | default('') | length) > 0
     else (kafka_ui_ssl_keystore_path | default('')) }}

_kafka_ui_sasl_login_module: >-
  {{ 'org.apache.kafka.common.security.scram.ScramLoginModule'
     if kafka_ui_sasl_mechanism.upper().startswith('SCRAM')
     else 'org.apache.kafka.common.security.plain.PlainLoginModule' }}

_kafka_ui_jaas_config: >-
  {{ kafka_ui_sasl_jaas_config
     if (kafka_ui_sasl_jaas_config | default('') | length) > 0
     else (_kafka_ui_sasl_login_module ~ ' required username="' ~ kafka_ui_sasl_username
           ~ '" password="' ~ kafka_ui_sasl_password ~ '";') }}

_kafka_ui_sasl_enabled: "{{ 'SASL' in (kafka_ui_security_protocol | default('') | upper) }}"
_kafka_ui_ssl_enabled: "{{ 'SSL' in (kafka_ui_security_protocol | default('') | upper) }}"

# properties, которые подмешиваются в каждый кластер
_kafka_ui_security_properties: >-
  {{
    ({'security.protocol': kafka_ui_security_protocol}
     if (kafka_ui_security_protocol | default('') | length) > 0 else {})
    | combine({'sasl.mechanism': kafka_ui_sasl_mechanism,
               'sasl.jaas.config': _kafka_ui_jaas_config}
              if _kafka_ui_sasl_enabled | bool else {})
    | combine({'ssl.endpoint.identification.algorithm': kafka_ui_ssl_endpoint_identification_algorithm}
              if _kafka_ui_ssl_enabled | bool else {})
    | combine({'ssl.truststore.location': _kafka_ui_truststore_dest,
               'ssl.truststore.type': kafka_ui_ssl_truststore_type}
              if (_kafka_ui_ssl_enabled | bool and (_kafka_ui_truststore_dest | length) > 0) else {})
    | combine({'ssl.truststore.password': kafka_ui_ssl_truststore_password}
              if (_kafka_ui_ssl_enabled | bool
                  and (_kafka_ui_truststore_dest | length) > 0
                  and (kafka_ui_ssl_truststore_password | default('') | length) > 0) else {})
    | combine({'ssl.keystore.location': _kafka_ui_keystore_dest,
               'ssl.keystore.type': kafka_ui_ssl_keystore_type,
               'ssl.keystore.password': kafka_ui_ssl_keystore_password}
              if (_kafka_ui_ssl_enabled | bool and (_kafka_ui_keystore_dest | length) > 0) else {})
    | combine({'ssl.key.password': kafka_ui_ssl_key_password}
              if (_kafka_ui_ssl_enabled | bool
                  and (_kafka_ui_keystore_dest | length) > 0
                  and (kafka_ui_ssl_key_password | default('') | length) > 0) else {})
  }}

# Кластеры с подмешанными настройками безопасности.
# Формируется в tasks/config.yml (set_fact), т.к. properties самого кластера
# должны перекрывать общие параметры.

# Итоговый application.yml
_kafka_ui_config: >-
  {{
    _kafka_ui_cfg_server
    | combine(_kafka_ui_cfg_kafka,
              _kafka_ui_cfg_auth,
              _kafka_ui_cfg_dynamic,
              _kafka_ui_cfg_logging,
              kafka_ui_config_extra | default({}, true),
              recursive=True)
  }}

# Пути, вычисляемые из основных переменных
_kafka_ui_jar_dest: "{{ kafka_ui_lib_dir }}/{{ kafka_ui_jar_name }}"
_kafka_ui_conf_file: "{{ kafka_ui_conf_dir }}/application.yml"
_kafka_ui_env_file: "{{ kafka_ui_conf_dir }}/kafka-ui.env"
_kafka_ui_unit_file: "/etc/systemd/system/{{ kafka_ui_service_name }}.service"
