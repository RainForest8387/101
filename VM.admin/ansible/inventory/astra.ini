# Инвентарь. Замените адреса и учётные записи на реальные.
# Проверка структуры:  ansible-inventory --graph
# Проверка переменных: ansible-inventory --host astra-app-01 --yaml

[astra17]
astra-app-01  ansible_host=10.0.0.11
astra-app-02  ansible_host=10.0.0.12

[astra18]
astra-db-01   ansible_host=10.0.0.21
astra-db-02   ansible_host=10.0.0.22

# --------------------------------------------------------- функциональные группы
[app]
astra-app-01
astra-app-02

[db]
astra-db-01
astra-db-02

[prod:children]
app
db

# --------------------------------------------------------- переменные групп
[astra17:vars]
astra_release=1.7
# На 1.7 штатный python3 — 3.7. Указываем явно, чтобы не полагаться на автоопределение.
ansible_python_interpreter=/usr/bin/python3

[astra18:vars]
astra_release=1.8
ansible_python_interpreter=/usr/bin/python3

[all:vars]
ansible_user=ansible
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_port=22
