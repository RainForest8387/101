# Конфигурация Ansible для парка Astra Linux 1.7 / 1.8.
# Лежит в корне проекта, подхватывается автоматически при запуске из этого каталога.
# Либо явно: export ANSIBLE_CONFIG=~/ansible/ansible.cfg

[defaults]
inventory            = inventory/
roles_path           = roles
collections_path     = ~/.ansible/collections

# Астра 1.7 несёт python 3.7, 1.8 — 3.11. auto_silent не даёт Ansible
# сыпать предупреждениями о выборе интерпретатора на каждом хосте.
interpreter_python   = auto_silent

forks                = 20
timeout              = 30
host_key_checking    = True
retry_files_enabled  = False
deprecation_warnings = False
stdout_callback      = yaml
callbacks_enabled    = profile_tasks, timer

log_path             = logs/ansible.log

# Кэш фактов: ускоряет повторные прогоны и позволяет строить отчёты
# по хостам, не опрашивая их заново.
gathering            = smart
fact_caching         = jsonfile
fact_caching_connection = .facts
fact_caching_timeout = 7200

[inventory]
enable_plugins = ini, yaml, host_list

[privilege_escalation]
become        = False
become_method = sudo
become_user   = root
become_ask_pass = False

[ssh_connection]
# ControlPersist резко ускоряет серию задач по одному хосту.
ssh_args      = -o ControlMaster=auto -o ControlPersist=300s -o PreferredAuthentications=publickey,gssapi-with-mic,password -o ServerAliveInterval=15
pipelining    = True
control_path  = /tmp/ansible-ssh-%%h-%%p-%%r
transfer_method = smart
retries       = 2

[persistent_connection]
connect_timeout = 30
command_timeout = 60
